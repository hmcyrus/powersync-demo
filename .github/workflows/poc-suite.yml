name: POC Phase 0 Suite

on:
  push:
  pull_request:

jobs:
  poc-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Wait for PowerSync
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/probes/liveness >/dev/null 2>&1; then
              echo "PowerSync is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PowerSync did not become ready in time"
          docker compose logs
          exit 1

      - name: Seed Postgres
        run: |
          docker compose exec -T postgres psql -U postgres -d postgres -c \
            "INSERT INTO todos (id, title, is_completed, created_at, tenant_id) VALUES ('11111111-1111-4111-8111-111111111111', 'synced from postgres', 0, now(), 'tenant-a') ON CONFLICT (id) DO NOTHING;"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start Vite dev server for 0.5
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > ../frontend-dev.log 2>&1 &
          echo $! > ../frontend-dev.pid

      - name: Wait for Vite dev
        run: |
          npm install --no-save wait-on
          npx wait-on -t 120000 http://localhost:5173

      - name: Run Phase 0 suite (0.5–0.8)
        working-directory: e2e
        run: |
          npm run test:0.6
          npm run test:0.7
          npm run test:0.8
          npm run test:0.5

      - name: Capture debug logs on failure
        if: failure()
        run: |
          docker compose logs > docker-logs.txt 2>&1
          cp -f frontend-dev.log frontend-dev-failure.log 2>/dev/null || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poc-suite-debug-${{ github.run_id }}
          path: |
            docker-logs.txt
            frontend-dev-failure.log

      - name: Stop Vite dev
        if: always()
        run: |
          if [ -f frontend-dev.pid ]; then kill "$(cat frontend-dev.pid)" 2>/dev/null || true; fi
