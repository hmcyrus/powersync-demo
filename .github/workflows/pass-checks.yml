name: Pass Checks

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to test
        required: true
        type: string
        default: main

jobs:
  pass-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Wait for PowerSync
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/probes/liveness >/dev/null 2>&1; then
              echo "PowerSync is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PowerSync did not become ready in time"
          docker compose logs
          exit 1

      - name: Seed Postgres
        run: |
          docker compose exec -T postgres psql -U postgres -d postgres -c \
            "INSERT INTO todos (id, title, is_completed, created_at) VALUES ('11111111-1111-4111-8111-111111111111', 'synced from postgres', 0, now()) ON CONFLICT (id) DO NOTHING;"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 </dev/null &
          echo $! > ../backend.pid

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > ../frontend.log 2>&1 </dev/null &
          echo $! > ../frontend.pid

      - name: Wait for app services
        run: |
          npm install --no-save wait-on
          npx wait-on -t 120000 http://localhost:5173 http-get://localhost:8000/todos

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run pass checks
        working-directory: e2e
        run: npm test

      - name: Capture debug logs on failure
        if: failure()
        run: |
          docker compose logs > docker-logs.txt 2>&1
          cp -f backend.log backend-failure.log 2>/dev/null || true
          cp -f frontend.log frontend-failure.log 2>/dev/null || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pass-checks-debug-${{ github.run_id }}
          path: |
            docker-logs.txt
            backend-failure.log
            frontend-failure.log

      - name: Stop app services
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" 2>/dev/null || true; fi
          if [ -f frontend.pid ]; then kill "$(cat frontend.pid)" 2>/dev/null || true; fi
