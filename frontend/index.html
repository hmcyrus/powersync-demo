<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerSync Todos POC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1>Todos</h1>
    <p id="status">Connecting…</p>
    <div id="auth-panel" hidden>
      <p>Sign in to sync your todos across devices.</p>
      <a id="sign-in" href="/api/auth/oidc/start?email=doctor@example.com">Sign in</a>
    </div>
    <div id="app-panel" hidden>
    <div class="add-row">
      <input id="title" type="text" placeholder="New todo title" />
      <button id="add" type="button">Add</button>
      <button id="network" type="button">Online</button>
    </div>
    <h2>Catalog</h2>
    <ul id="catalog"></ul>
    <ul id="list"></ul>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
